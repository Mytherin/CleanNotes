# The iPhone app's Xcode project, for XcodeGen (`brew install xcodegen`):
#
#   cd ios && xcodegen && open CleanNotes.xcodeproj
#
# The Rust core is built by ios/build-rust.sh, which the project runs before
# compiling (the first build takes a few minutes).
name: CleanNotes
options:
  bundleIdPrefix: com.cleannotes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  CleanNotes:
    type: application
    platform: iOS
    # The CleanNotes scheme runs the tests (xcodebuild test -scheme CleanNotes).
    scheme:
      testTargets:
        - CleanNotesTests
    sources:
      - path: CleanNotes
      - path: Generated/cleannotes_ffi.swift
        optional: true
        createIntermediateGroups: true
    dependencies:
      - framework: build/CleanNotesCore.xcframework
        embed: false
        link: true
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    preBuildScripts:
      - name: Build the Rust core
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            "$PROJECT_DIR/build-rust.sh" --debug
          else
            "$PROJECT_DIR/build-rust.sh"
          fi
        outputFiles:
          - $(PROJECT_DIR)/Generated/cleannotes_ffi.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleannotes.CleanNotes
        PRODUCT_NAME: CleanNotes
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Notes
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID opens your locked notes.
        INFOPLIST_KEY_NSCameraUsageDescription: The camera scans documents and text into your notes.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
  # Unit tests of the app's Swift (the text view against the Rust engine,
  # rendering, sharing), run in the app on the iOS Simulator:
  #   xcodebuild test -project CleanNotes.xcodeproj -scheme CleanNotes \
  #     -destination 'platform=iOS Simulator,name=iPhone 16'
  CleanNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CleanNotesTests
    dependencies:
      - target: CleanNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleannotes.CleanNotesTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

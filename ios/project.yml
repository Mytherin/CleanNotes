# The iPhone app's Xcode project, for XcodeGen (`brew install xcodegen`):
#
#   cd ios && xcodegen && open CleanNotes.xcodeproj
#
# The Rust core is built by ios/build-rust.sh, which the project runs before
# compiling (the first build takes a few minutes).
name: CleanNotes
options:
  bundleIdPrefix: com.cleannotes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  CleanNotes:
    type: application
    platform: iOS
    # The CleanNotes scheme runs the tests (xcodebuild test -scheme CleanNotes).
    scheme:
      testTargets:
        - CleanNotesTests
    sources:
      - path: CleanNotes
      - path: Generated/cleannotes_ffi.swift
        optional: true
        createIntermediateGroups: true
      # Compiled into the share extension too.
      - path: Shared
    entitlements:
      path: CleanNotes/CleanNotes.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cleannotes.CleanNotes
    dependencies:
      - target: CleanNotesShare
        embed: true
        codeSign: true
      - framework: build/CleanNotesCore.xcframework
        embed: false
        link: true
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    preBuildScripts:
      - name: Build the Rust core
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            "$PROJECT_DIR/build-rust.sh" --debug
          else
            "$PROJECT_DIR/build-rust.sh"
          fi
        outputFiles:
          - $(PROJECT_DIR)/Generated/cleannotes_ffi.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleannotes.CleanNotes
        PRODUCT_NAME: CleanNotes
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Notes
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID opens your locked notes.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
  # The share extension: "Notes" in other apps' share sheets, to add what's
  # shared (text, links, pictures, files) to a new note or one already there,
  # as in Apple Notes. It leaves it in the App Group's inbox, and the app adds
  # it when it next comes to the foreground (ios/Shared/ShareInbox.swift).
  CleanNotesShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CleanNotesShare
      - path: Shared
    info:
      path: CleanNotesShare/Info.plist
      properties:
        CFBundleDisplayName: Notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 20
    entitlements:
      path: CleanNotesShare/CleanNotesShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cleannotes.CleanNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleannotes.CleanNotes.Share
        PRODUCT_NAME: CleanNotesShare
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
  # Unit tests of the app's Swift (the text view against the Rust engine,
  # rendering, sharing), run in the app on the iOS Simulator:
  #   xcodebuild test -project CleanNotes.xcodeproj -scheme CleanNotes \
  #     -destination 'platform=iOS Simulator,name=iPhone 16'
  CleanNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CleanNotesTests
    dependencies:
      - target: CleanNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleannotes.CleanNotesTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

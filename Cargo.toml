[workspace]
members = [".", "core", "ffi"]
resolver = "2"

# The desktop app (egui). The notes, editing, storage and sync logic it shares
# with the iPhone app is in `core/`; `ffi/` exposes that core to Swift, and
# `ios/` is the iPhone app.
[package]
name = "clean-notes"
version = "0.1.0"
edition = "2021"
description = "An Apple Notes–style desktop notes app with pluggable sync (Bitwarden, CloudKit, Standard Notes, SQLite)"

[[bin]]
name = "CleanNotes"
path = "src/main.rs"

[dependencies]
cleannotes-core = { path = "core" }
eframe = "0.29"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
open = "5"
anyhow = "1"
ttf-parser = "0.25"
serde_json = "1"
base64 = "0.22"
# Evernote exports refer to attachments by the MD5 hash of their data.
md5 = { package = "md-5", version = "0.10" }

[dev-dependencies]
tempfile = "3"
png = "0.17"

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
wry = "0.57.2"

# A hidden window of its own for the browser engine (see webfetch.rs); the
# version wry uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

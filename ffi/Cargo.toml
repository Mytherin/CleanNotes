[package]
name = "cleannotes-ffi"
version = "0.1.0"
edition = "2021"
description = "CleanNotes' core for Swift (the iPhone app), through UniFFI."

[lib]
name = "cleannotes_ffi"
# staticlib for the iOS app (in an XCFramework); cdylib for generating the
# Swift bindings from the library's metadata; lib for the tests.
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
cleannotes-core = { path = "../core" }
uniffi = "0.29"

[dev-dependencies]
tempfile = "3"
# The CleanPassword tests make a vault header.
chrono = "0.4"
